<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prestige-Pages Sign Up</title>
    <link rel="stylesheet" href="css/signup.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav">
        <button
          class="icon-btn hamburger"
          id="navToggle"
          aria-label="Open menu"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M3 6h18M3 12h18M3 18h18"
              stroke="#5f5a54"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        </button>
        <div class="brand">PrestigePages</div>
        <nav class="nav-links" aria-label="Main">
          <a href="index.html">Home</a>
          <a href="index.html#popular">Store</a>
          <a href="about-us.html">About us</a>
          <a href="faq.html">FAQ</a>
        </nav>

        <div class="nav-spacer"></div>

        <div class="actions">
          <nav class="nav-links" aria-label="Main">
            <a href="login.html">Log In</a>
            <a href="signup.html">Sign Up</a>
          </nav>
        </div>
      </div>
    </header>
    <div class="containers">
      <h1>Create a new Account.</h1>
      <p>
        Already have an account?
        <a href="login.html">
          <span style="color: rgb(75, 75, 245)"><u>Login</u></span></a
        >
      </p>
      <form id="signupForm">
        <div class="row">
          <div class="input-container">
            <i class="fa-solid fa-user"></i>
            <input
              type="text"
              id="firstName"
              placeholder="First Name"
              required
            />
          </div>

          <div class="input-container">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="lastName" placeholder="Last Name" required />
          </div>
        </div>

        <div class="input-container">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="email" placeholder="Email" required />
        </div>

        <div class="input-container">
          <i class="fa-solid fa-lock"></i>
          <input
            type="password"
            id="password"
            placeholder="Password"
            required
          />
          <i class="fa-solid fa-eye" id="togglePassword"></i>
        </div>

        <div class="input-container">
          <i class="fa-solid fa-lock"></i>
          <input
            type="password"
            id="cpassword"
            placeholder="Confirm Password"
            required
          />
          <i class="fa-solid fa-eye" id="toggleCPassword"></i>
        </div>

        <div class="input-container">
          <i class="fa-solid fa-phone"></i>
          <input type="tel" id="mobile" placeholder="Mobile Number" required />
        </div>
          

        <div class="checkbox-group">
          <div class="checkbox-item">
            <input type="checkbox" id="terms" required>
            <label for="terms">
              <span class="checkmark"></span>
              I have read and agree to the&nbsp;
            </label>
            <a href="terms.html" target="_blank">Terms and Conditions</a>
          </div>

          <div class="checkbox-item">
            <input type="checkbox" id="privacy" required>
            <label for="privacy">
              <span class="checkmark"></span>
              I have read and agree to the&nbsp;
            </label>
            <a href="privacy-policy.html" target="_blank">Privacy Policy</a>
          </div>
        </div>

        <button class="login-btn" type="submit">Sign Up</button>
      </form>
    </div>

    <script type="module">
  // Firebase imports (keep same versions you used)
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
  import {
    getAuth,
    createUserWithEmailAndPassword,
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
  import {
    getFirestore,
    doc,
    setDoc,
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
  import { firebaseConfig } from "./js/firebase-config.js";

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // DOM refs
  const signupForm = document.getElementById("signupForm");
  const navToggle = document.getElementById("navToggle");

  // -------------------------
  // FORM SUBMIT HANDLER
  // -------------------------
  signupForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    // Collect values
    const firstName = document.getElementById("firstName").value.trim();
    const lastName = document.getElementById("lastName").value.trim();
    const mobile = document.getElementById("mobile").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const cpassword = document.getElementById("cpassword").value;

    // Check checkboxes (these must exist in the form)
    const terms = document.getElementById("terms");
    const privacy = document.getElementById("privacy");

    if (!terms || !privacy) {
      // If the checkboxes are missing for some reason, don't proceed.
      alert("Developer error: terms/privacy checkboxes not found.");
      return;
    }

    // If either unchecked -> show required alert and stop
    if (!terms.checked || !privacy.checked) {
      alert(
        "Please Read and Check the Terms and Condition and Privacy Policy before Logging In or Signing Up."
      );
      return;
    }

    // Basic validation
    const mobileRegex = /^09\d{9}$/;
    if (!mobileRegex.test(mobile)) {
      alert(
        "❌ Invalid mobile number. It must start with 09 and be 11 digits."
      );
      return;
    }

    if (password !== cpassword) {
      alert("❌ Passwords do not match. Please try again.");
      return;
    }

    if (password.length < 6) {
      alert("❌ Password too short. It should be at least 6 characters.");
      return;
    }

    try {
      // Create the account immediately without OTP verification
      const userCredential = await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );
      const user = userCredential.user;

      await setDoc(doc(db, "users", user.uid), {
        firstName,
        lastName,
        mobile,
        email,
        createdAt: new Date(),
      });

      alert("✅ Account created successfully! Redirecting to homepage...");
      signupForm.reset();
      window.location.href = "homepage-logged.html";
    } catch (error) {
      console.error("Account creation error:", error);
      if (error.code === "auth/email-already-in-use") {
        alert("❌ Email already in use. Try logging in instead.");
      } else if (error.code === "auth/invalid-email") {
        alert("❌ Invalid email format.");
      } else if (error.code === "auth/weak-password") {
        alert("❌ Weak password. It should be at least 6 characters.");
      } else {
        alert("❌ Error creating account. Please try again.");
      }
    }
  });

  // -------------------------
  // Password visibility toggles
  // -------------------------
  function togglePasswordVisibility(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (!input || !icon) return;

    icon.addEventListener("click", () => {
      const isHidden = input.type === "password";
      input.type = isHidden ? "text" : "password";
      icon.classList.toggle("fa-eye");
      icon.classList.toggle("fa-eye-slash");
    });
  }

  togglePasswordVisibility("password", "togglePassword");
  togglePasswordVisibility("cpassword", "toggleCPassword");

  // -------------------------
  // Mobile nav toggle (same as your previous code)
  // -------------------------
  if (navToggle) {
    navToggle.addEventListener("click", () => {
      const existing = document.getElementById("mobileMenu");
      if (existing) {
        existing.remove();
        return;
      }
      const menu = document.createElement("div");
      menu.id = "mobileMenu";
      menu.style.background = "var(--paper)";
      menu.style.borderTop = "1px solid var(--line)";
      menu.innerHTML = `<div class="container" style="padding:12px 20px 16px; display:grid; gap:10px;">
          <a href="index.html">Home</a>
          <a href="#popular">Store</a>
          <a href="about-us.html">About us</a>
        </div>`;
      document.querySelector(".site-header").appendChild(menu);
    });
  }
</script>
  </body>
</html>
